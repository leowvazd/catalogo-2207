<footer class="lessenzza-footer">
  <div class="container">
    <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3 py-4">
      <div class="text-center text-sm-start">
        <span class="lessenzza-footer-brand">Lessenzza</span>
        <span class="d-block d-sm-inline text-muted small ms-sm-3">
          &copy; {{ year }} · Defined by elegance
        </span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <a
          [href]="instagramUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="lessenzza-social-icon"
          aria-label="Instagram"
          title="Instagram"
        >
          <i class="bi bi-instagram"></i>
        </a>

        <a
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="lessenzza-social-icon"
          aria-label="WhatsApp"
          title="WhatsApp"
        >
          <i class="bi bi-whatsapp"></i>
        </a>
      </div>
    </div>
  </div>
</footer>

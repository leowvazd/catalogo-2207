#version: '3.8'

services:
  # Container PHP + Laravel
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: catalogo_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - catalogo_network

  # Container Servidor Web
  webserver:
    image: nginx:alpine
    container_name: catalogo_webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - catalogo_network

  # Container Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: catalogo_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: catalogo_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - catalogo_network

  # Container do Certbot
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  catalogo_network:
    driver: bridge

volumes:
  dbdata:
    driver: local